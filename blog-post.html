<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Read a story from the Chenthur Jewellers journal.">
  <meta property="og:title" content="Blog | Chenthur Jewellers">
  <meta property="og:description" content="Stories, guidance and inspiration from Chenthur Jewellers.">
  <meta property="og:type" content="article">
  <title>Blog | Chenthur Jewellers</title>
  <link rel="icon" type="image/png" href="assets/images/favicon.png">
  <link rel="apple-touch-icon" href="assets/images/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=IBM+Plex+Sans:wght@300;400;500;600&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/main.css">
  <script src="assets/js/content.js" defer></script>
  <script src="assets/js/app.js" defer></script>
</head>
<body data-page="blog">
  <div id="site-header"></div>

  <main id="main">
    <article class="blog-post">
      <header class="blog-post__head">
        <div class="container">
          <nav class="breadcrumbs" aria-label="Breadcrumb" data-blog-breadcrumb></nav>
          <p class="eyebrow" data-blog-category></p>
          <h1 data-blog-title></h1>
          <p class="blog-post__meta" data-blog-meta></p>
        </div>
      </header>

      <div class="container">
        <figure class="blog-post__cover">
          <img data-blog-cover alt="" width="1600" height="900">
        </figure>
      </div>

      <div class="container blog-post__body" data-blog-article></div>

      <div class="container blog-post__back">
        <a class="text-link" href="blog.html">Back to the blog <span aria-hidden="true">→</span></a>
      </div>
    </article>

    <section class="section section--cream" data-blog-more-section hidden>
      <div class="container">
        <div class="section-head">
          <div class="section-head__copy">
            <p class="eyebrow">Keep reading</p>
            <h2>More from the blog</h2>
          </div>
          <a class="text-link" href="blog.html">View all posts <span aria-hidden="true">→</span></a>
        </div>
        <div class="blog-grid" data-blog-more></div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>
</body>
</html>
